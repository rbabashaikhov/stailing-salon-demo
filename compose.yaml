# VPS preview compose. Do not publish the app port to the public internet.
name: stailing-demo

services:
  stailing-demo:
    build:
      context: .
      args:
        VITE_DEMO_MODE: "true"
        VITE_API_URL: ""
    image: stailing/demo:latest
    container_name: stailing-demo
    restart: unless-stopped
    environment:
      PORT: "8080"
      NODE_ENV: production
      DEMO_MODE: "true"
      CRM_PROVIDER: demo
      SQLITE_PATH: /app/data/demo-bookings.sqlite
    volumes:
      - stailing_demo_data:/app/data
    networks:
      - miniapps-net
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8093:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  stailing_demo_data:

networks:
  miniapps-net:
    external: true
